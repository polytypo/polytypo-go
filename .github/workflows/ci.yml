name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["oldstable", "stable"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6.0.0
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true

      - name: Format check (gofmt)
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # rapid.checks is only registered by test binaries that import pgregory.net/rapid (the
      # root package); passing it to `go test ./...` fails "-rapid.checks: flag provided but not
      # defined" on every package that doesn't. -timeout is set explicitly: the idempotency
      # bounded-exhaustive sweeps and the concurrency test are slow enough under -race that the
      # unset default (10m) is not reliable headroom on every runner.
      #
      # Raised from 15m to 40m with spec 1.3.0. The two slowest tests are per-locale, and the
      # registry went from ten locales to eighteen: the same suite takes 66s here without -race
      # and overran 15m with it. The number is a margin over that overrun, not a measurement --
      # -race needs cgo and no C toolchain was available to time it locally. Shrinking the sweep
      # instead is not on the table; it is the thing being bought.
      - name: Test
        run: go test ./... -race -timeout=40m

      - name: Test (root package, higher rapid.checks)
        run: go test . -race -timeout=40m -rapid.checks=1000

      - name: Staticcheck
        uses: dominikh/staticcheck-action@672a31696676d1592844bf0164b3bbfd855a4d50 # v1.4.1
        with:
          version: latest
          install-go: false

  vendored-spec:
    name: Vendored spec matches canonical
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      # The vendored spec subset in this repository is a manually synced copy of canonical
      # polytypo's spec/. Its data half stays current because the test suite fails without it;
      # nothing checked its rules/*.md half, and four published packages shipped rule
      # documentation that contradicted their own engine (polytypo/polytypo#56). This compares
      # every vendored file against canonical at the tag the vendored VERSION names, so a stale
      # copy — or a released spec amended in place — fails here rather than reaching a package.
      # Completeness is checked against canonical's own tree, so a deleted vendored file fails
      # too, and a tree current with the tag it claims while canonical has tagged a newer
      # version is a warning here and a refusal in the release job.
      - name: Compare against canonical spec tag
        run: sh scripts/check-vendored-spec.sh internal/spec
